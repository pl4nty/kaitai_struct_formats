name: sample-tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'  # weekly: catch dead sample URLs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install ksc and runtime
        run: |
          curl -fsSLO https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          sha256sum -c -w .github/kaitai-struct-compiler_0.11_all.deb.sha256
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y default-jre-headless ./kaitai-struct-compiler_0.11_all.deb
          pip install kaitaistruct pyyaml lz4 brotli
      - name: Fetch kaitai_compress (for specs with process kaitai.compress.*)
        run: |
          git clone --quiet https://github.com/pl4nty/kaitai_compress "$RUNNER_TEMP/kaitai_compress"
          git -C "$RUNNER_TEMP/kaitai_compress" fetch --quiet origin b8c273263206387f9a8edb21ee1a52670296b767
          git -C "$RUNNER_TEMP/kaitai_compress" checkout --quiet b8c273263206387f9a8edb21ee1a52670296b767
          echo "PYTHONPATH=$RUNNER_TEMP/kaitai_compress/python" >> "$GITHUB_ENV"
      - name: Validate manifests
        run: python3 _test/run_samples.py --validate-only
      - name: Restore sample cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: _test/.cache
          key: ksf-samples-${{ hashFiles('_test/samples/**') }}
          restore-keys: ksf-samples-
      - name: Run sample tests
        run: python3 _test/run_samples.py --junit _test/junit.xml
      - name: Coverage
        if: always()
        run: python3 _test/run_samples.py --coverage | sed -n 1p >> "$GITHUB_STEP_SUMMARY"  # not head: it closes the pipe early
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-tests-junit
          path: _test/junit.xml
          if-no-files-found: ignore  # e.g. manifest validation failed first
