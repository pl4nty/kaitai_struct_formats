    sha256: f181472d344a522a2b9b4c5d7b355f033970a18f3de359dea584be869e9bd406
    source: walbourn/directxtktest a3010123ab01 ModelTest/cup.sdkmesh
    license: MIT
    expect:
      header.version: 101
      header.len_header: 0x1a8
      header.len_non_buffer_data: 4624
      header.len_buffer_data: 57344
