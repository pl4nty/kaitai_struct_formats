# UUID test vectors: RFC 9562 Appendix A.1 (v1), A.5 (v6), A.6 (v7) and the RFC 4122 Appendix C
# DNS namespace UUID. Expects from CPython's uuid module (version, variant, clock_seq, time for
# v1) and from the RFC text (the v6 timestamp equals the v1 one, 0x1EC9414C232AB00; the v7
# unix_ts_ms is 0x017F22E279B0).
samples:
  - name: rfc9562-a1-v1
    data: c232ab00941411ecb3c89f6bdeced846
    eof: true
    expect:
      variant: rfc4122
      version: 1
      clock_seq: 0x33c8
      timestamp_v1: 0x1ec9414c232ab00
      node: 9f6bdeced846
  - name: rfc9562-a5-v6
    data: 1ec9414c232a6b00b3c89f6bdeced846
    eof: true
    expect:
      version: 6
      clock_seq: 0x33c8
      timestamp_v6: 0x1ec9414c232ab00
  - name: rfc9562-a6-v7
    data: 017f22e279b07cc398c4dc0c0c07398f
    eof: true
    expect:
      variant: rfc4122
      version: 7
      unix_ts_ms_v7: 0x017f22e279b0
  - name: rfc4122-namespace-dns
    data: 6ba7b8109dad11d180b400c04fd430c8
    eof: true
    expect:
      version: 1
      clock_seq: 0xb4
      timestamp_v1: 0x1d19dad6ba7b810
