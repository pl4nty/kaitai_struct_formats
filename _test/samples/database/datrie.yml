# libthai's Thai word-break dictionary (a libdatrie trie file), from the Debian libthai-data
# 0.1.29-2 package on snapshot.debian.org. The .deb is an ar archive; data.tar.xz is the member
# at offset 1020 (166484 bytes). Expect values read by hand from a hex dump against libdatrie's
# alpha-map.c / darray.c / tail.c serialisation.
samples:
  - url: https://snapshot.debian.org/archive/debian/20240105T145613Z/pool/main/libt/libthai/libthai-data_0.1.29-2_all.deb
    sha256: fd38d40602834d510a29140bd27fd48485105e834f03dccab1c02e2edaa794dd
    name: thbrk.tri
    extract:
      format: slice
      offset: 1020
      size: 166484
      then:
        format: xz
        then: { format: tar, member: ./usr/share/libthai/thbrk.tri }
    eof: true
    expect:
      alpha_map.total_ranges: 1
      alpha_map.ranges[0].begin: 0x0e01
      alpha_map.ranges[0].end: 0x0e5b
      da.header.cell_count: 37207
      tails.tail_count: 25110
