# expects from `GIT_INDEX_FILE=<sample> git ls-files -s`
samples:
  - url: https://raw.githubusercontent.com/GitoxideLabs/gitoxide/9abb53183a296185fc4e98376bc4ab895f39c2fe/gix-index/tests/fixtures/loose_index/very-long-path.git-index
    sha256: a61b2c5ec481ad0ac77acf55a9f4344b9d35e9d5496d50f883ed6cefd98de3b6
    eof: true
    expect:
      header.version: 2
      header.num_entries: 9
      entries[1].entry.name: path0/file2
    xfail: TREE extension entry with entry_count -1 (invalidated) has no object name per gitformat-index, but tree_entry always reads 20-byte object_name
  - url: https://raw.githubusercontent.com/GitoxideLabs/gitoxide/9abb53183a296185fc4e98376bc4ab895f39c2fe/gix-index/tests/fixtures/loose_index/conflicting-file.git-index
    sha256: ceccc02e6f17df441d14cfd38851336cc7b679f20836f2ebf8049dea6df6921d
    eof: true
    expect:
      header.num_entries: 3
      entries[0].entry.name_flag.stage: 1
      entries[2].entry.name_flag.stage: 3
    xfail: TREE extension entry with entry_count -1 (invalidated) has no object name per gitformat-index, but tree_entry always reads 20-byte object_name
  - url: https://raw.githubusercontent.com/GitoxideLabs/gitoxide/9abb53183a296185fc4e98376bc4ab895f39c2fe/gix-index/tests/fixtures/loose_index/REUC.git-index
    sha256: 04be3dd96f2a76f806e1fc533c6f7b95a883bd6ba755acd5482d6c6b1d259123
    eof: true
    expect:
      header.num_entries: 2
      entries[0].entry.name: binary
