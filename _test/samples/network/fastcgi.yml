# TCP payloads cut from the Wireshark sample capture fcgi.pcap.gz; expects from
# `tshark -d tcp.port==9000,fcgi -O fcgi`
samples:
  - url: https://wiki.wireshark.org/uploads/__moin_import__/attachments/SampleCaptures/fcgi.pcap.gz
    sha256: 7c3bcba991d97dc7e46f9cc7466bec911e3288c54a58cac05ccb51b9f4b59573
    name: fcgi-frame4-begin-request
    source: Wireshark SampleCaptures fcgi.pcap.gz, frame 4 TCP payload (FCGI_BEGIN_REQUEST)
    extract: { format: gzip, then: { format: slice, offset: 368, size: 16 } }
    eof: true
    expect:
      len(records): 1
      records[0].header.type: begin_request
      records[0].header.request_id: 1
      records[0].header.content_length: 8
    xfail: spec declares meta endian le, but FastCGI header fields (requestId, contentLength, role) are big-endian; contentLength 8 reads as 2048 and overruns the record
  - url: https://wiki.wireshark.org/uploads/__moin_import__/attachments/SampleCaptures/fcgi.pcap.gz
    sha256: 7c3bcba991d97dc7e46f9cc7466bec911e3288c54a58cac05ccb51b9f4b59573
    name: fcgi-frame5-params
    source: Wireshark SampleCaptures fcgi.pcap.gz, frame 5 TCP payload (FCGI_PARAMS, 1047 bytes of name-value pairs)
    extract: { format: gzip, then: { format: slice, offset: 466, size: 1055 } }
    eof: true
    expect:
      len(records): 1
      records[0].header.type: params
      records[0].header.content_length: 1047
    xfail: spec declares meta endian le, but FastCGI contentLength is big-endian (0x0417 read as 0x1704), so content_data overruns the record
