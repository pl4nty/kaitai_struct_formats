      body.key_id.value: julius
      "[s.value for s in body.valid_principals.strings.strings]": [host1, host2]
      body.valid_after: 915145200    # 1998-12-31T23:00:00Z
      body.valid_before: 1293836400  # 2010-12-31T23:00:00Z
      len(body.critical_options.tuples.tuples): 0
      len(body.extensions.tuples.tuples): 0
