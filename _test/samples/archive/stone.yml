# Serpent OS / AerynOS moss package test fixtures (.stone v1 binary packages).
# Expect values read by hand from a hex dump against moss's stone header/payload layout
# (32-byte header, then 32-byte payload headers each followed by len_data bytes).
samples:
  - url: https://raw.githubusercontent.com/serpent-os/moss/5e9a82bbad81cf16bfcf2c483e3df0b07c799186/test/bash-completion-2.11-1-1-x86_64.stone
    sha256: 13e2bce256b183ee0c721bd6cc438be8dcebf95850c8d851801e4ce000195d94
    eof: true
    expect:
      header.num_payloads: 4
      header.file_type: binary
      header.version: 1
      payloads[0].type: meta
      payloads[0].num_records: 11
      payloads[3].type: content
      payloads[3].compression: zstd
      payloads[3].len_usable_data: 872279
  - url: https://raw.githubusercontent.com/serpent-os/moss/5e9a82bbad81cf16bfcf2c483e3df0b07c799186/test/conflicts/pineapple-1-1-1-x86_64.stone
    sha256: 1c8681fda365a0dbb05e598db311e4c951fed2c65e070273940d85541c02ab07
    eof: true
    expect:
      header.num_payloads: 4
      payloads[1].type: layout
      payloads[2].type: index
      payloads[3].len_data: 9
