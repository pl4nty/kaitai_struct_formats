# Old installers from Sembiance's file format samples, Greenshot 1.2.10.6 and
# Inno Setup's own installers. The loader offset table is found through the
# pointer at 0x34 for the old loaders and by its 5.1.5 signature
# ("rDlPtS" CD E6 D7 7B 0B 2A) otherwise. Expects were read by hand: the
# version strings ("Inno Setup Setup Data (x.y.z)") and table revisions from a
# hex dump, the encryption header following issrc Shared.Struct.pas and the
# inno crate v0.7.6.
samples:
  - url: https://sembiance.com/fileFormatSamples/archive/innoSetupInstaller/1674007302_setup.exe
    sha256: 3b35d5b00c0286c8b1f5bea0811330102383410fdc9430ebcfac4fe596baa9a4
    params:
      ofs_offset_table: "int.from_bytes(_data[0x34:0x38], 'little')"
    expect:
      setup_0.version.number: 30005
      setup_0.version.is_unicode: false
  - url: https://sembiance.com/fileFormatSamples/archive/innoSetupInstaller/Setup.exe
    sha256: 05db659b508fc9eaa84fdcae8731ba735187a85f817191c01e83d66558475449
    name: inno_Setup.exe
    params:
      ofs_offset_table: "int.from_bytes(_data[0x34:0x38], 'little')"
    expect:
      offset_table.signature: 72446c507453303287655678   # "rDlPtS02" 87 65 56 78
      setup_0.version.number: 20011
  - url: https://sembiance.com/fileFormatSamples/archive/innoSetupInstaller/etc_setup.exe
    sha256: 76fc3ca99f81a2cb46caa69cedc74bd65fd0a179d1b86ed75462e0e894490c4e
    params:
      ofs_offset_table: "int.from_bytes(_data[0x34:0x38], 'little')"
    expect:
      setup_0.version.number: 20018
  - url: https://github.com/greenshot/greenshot/releases/download/Greenshot-RELEASE-1.2.10.6/Greenshot-INSTALLER-1.2.10.6-RELEASE.exe
    sha256: 1687311b4e7a3720be20490e8ed6cc772a32336a7bed8896e475b8ec616c6b81
    params:
      ofs_offset_table: "_data.index(bytes.fromhex('72446c507453cde6d77b0b2a'))"
    expect:
      offset_table.revision: 1
      setup_0.version.number: 50507
      setup_0.version.is_unicode: true
      setup_0.primary_stream.header.compression: lzma
  - url: https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe
    sha256: f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b
    params:
      ofs_offset_table: "_data.index(bytes.fromhex('72446c507453cde6d77b0b2a'))"
    expect:
      offset_table.revision: 1
      setup_0.version.number: 60403
      setup_0.version.suffix: ''
      setup_0.version.is_unicode: true
  - url: https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe
    sha256: fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1
    params:
      ofs_offset_table: "_data.index(bytes.fromhex('72446c507453cde6d77b0b2a'))"
    expect:
      offset_table.revision: 2
      setup_0.version.number: 60502
      setup_0.encryption_header.encryption_use: none
      setup_0.encryption_header.kdf_iterations: 220000
  - url: https://github.com/jrsoftware/issrc/releases/download/is-6_7_0/innosetup-6.7.0.exe
    sha256: f45c7d68d1e660cf13877ec36738a5179ce72a33414f9959d35e99b68c52a697
    params:
      ofs_offset_table: "_data.index(bytes.fromhex('72446c507453cde6d77b0b2a'))"
    expect:
      setup_0.version.number: 60700
