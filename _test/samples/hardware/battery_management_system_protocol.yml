# UART frames captured from a JBD SP04S034 (LLT Power protocol) BMS, as logged in
# syssi/esphome-jbd-bms docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt (">>> request <<< response",
# colon-separated hex); each sample slices one frame out of the log and decodes the hex.
# Expect values read by hand from the frames against the protocol PDF (registers 0x03 basic
# info, 0x04 cell voltages, 0x05 hardware version); the same pack is decoded as 15.60 V,
# 4.98/5.00 Ah, 4 cells, 3 probes in the repo's docs/debug.txt.
samples:
  - url: https://raw.githubusercontent.com/syssi/esphome-jbd-bms/a2a3bbf4871c1bc94174782d62189e219db9295c/docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt
    sha256: da3b83037a4f802789d0cc4dde77e19111556e56de9f8922884d3bce8a5e70eb
    name: jbd-read-basic-info-request
    source: syssi/esphome-jbd-bms docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt line 1 (request)
    license: Apache-2.0
    extract: { format: slice, offset: 4, size: 20, then: { format: hex } }
    eof: true
    expect:
      cmd: 0xa5
      body.req_cmd: 3
      body.len_data: "00"
      checksum: 0xfffd
  - url: https://raw.githubusercontent.com/syssi/esphome-jbd-bms/a2a3bbf4871c1bc94174782d62189e219db9295c/docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt
    sha256: da3b83037a4f802789d0cc4dde77e19111556e56de9f8922884d3bce8a5e70eb
    name: jbd-basic-info-response
    source: syssi/esphome-jbd-bms docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt line 1 (response)
    license: Apache-2.0
    extract: { format: slice, offset: 29, size: 107, then: { format: hex } }
    eof: true
    expect:
      cmd: 3
      body.status: 0
      body.len_data: 29
      body.data.pack_voltage.raw: 1560
      body.data.typ_cap.raw: 500
      body.data.cell_count: 4
      body.data.num_temps: 3
      checksum: 0xfa8d
  - url: https://raw.githubusercontent.com/syssi/esphome-jbd-bms/a2a3bbf4871c1bc94174782d62189e219db9295c/docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt
    sha256: da3b83037a4f802789d0cc4dde77e19111556e56de9f8922884d3bce8a5e70eb
    name: jbd-cell-voltages-response
    source: syssi/esphome-jbd-bms docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt line 3 (response)
    license: Apache-2.0
    extract: { format: slice, offset: 303, size: 44, then: { format: hex } }
    eof: true
    expect:
      cmd: 4
      body.len_data: 8
      len(body.data.cells): 4
      body.data.cells[0].raw: 3909
  - url: https://raw.githubusercontent.com/syssi/esphome-jbd-bms/a2a3bbf4871c1bc94174782d62189e219db9295c/docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt
    sha256: da3b83037a4f802789d0cc4dde77e19111556e56de9f8922884d3bce8a5e70eb
    name: jbd-hardware-response
    source: syssi/esphome-jbd-bms docs/pdus/JBD-SP04S034-L4S-200A-B-U.txt line 5 (response)
    license: Apache-2.0
    extract: { format: slice, offset: 451, size: 95, then: { format: hex } }
    eof: true
    expect:
      cmd: 5
      body.data.version: JBD-SP04S034-L4S-200A-B-U
