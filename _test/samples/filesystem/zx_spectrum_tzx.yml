# libspectrum test tapes (hand-made test inputs). Expects from a hex read against the TZX 1.20
# specification: jump.tzx is a 0x23 jump (+2) and two 0x12 pure tones (pulse 0x12f, 0x2a6
# pulses); raw-data-block.tzx is a TZX 1.16 0x15 direct recording (10 T-states per sample, 4 used
# bits in the last byte, 3 sample bytes).
samples:
  - url: https://raw.githubusercontent.com/fuse-emulator/libspectrum/77c003f9b1c9896fbb3ac9c8fa8272146463174c/test/jump.tzx
    sha256: c907d10215e31d713f253ab85facf82e2cb9ed0fa490e3ee96cb07f0d253f035
    eof: true
    expect:
      header.version_major: 1
      header.version_minor: 20
      len(blocks): 3
      blocks[0].block_id: jump
      blocks[0].body.relative_jump: 2
      blocks[1].block_id: pure_tone
      blocks[1].body.len_pulse: 0x12f
      blocks[1].body.num_pulses: 0x2a6
  - url: https://raw.githubusercontent.com/fuse-emulator/libspectrum/77c003f9b1c9896fbb3ac9c8fa8272146463174c/test/raw-data-block.tzx
    sha256: 0d0270cd01bfbba76f40592c8d11c8edea29e09d01b263b72ae06d2cf5b848f6
    eof: true
    expect:
      header.version_minor: 16
      blocks[0].body.tstates_per_sample: 10
      blocks[0].body.used_bits_last_byte: 4
      blocks[0].body.len_samples: 3
