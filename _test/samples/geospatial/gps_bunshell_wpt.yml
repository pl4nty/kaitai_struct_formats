samples:
  - url: https://raw.githubusercontent.com/gpsbabel/gpsbabel/abbb8136037748606d09406130a9532493fa2342/reference/bushnell.wpt
    sha256: c8cda8c6ed80031b087133d20cb05040ddee7cb63ed3d3ed56734f03a5536ad5
    source: gpsbabel reference data (before the bushnell format was removed); expects from gpsbabel's reference/bushnell.gpx decode
    license: GPL-2.0-or-later
    expect:
      len(waypoints): 1
      waypoints[0].point.lat.raw: 552963000
      waypoints[0].point.lon.raw: -1332431000
      waypoints[0].name: Waterfall Resort
    xfail: name is a fixed 20-byte NUL-padded field followed by 2 padding bytes (gpsbabel bushnell.cc writes one 32-byte waypoint per file); the spec reads strz with repeat eos, so the padding is parsed as a second, truncated waypoint
